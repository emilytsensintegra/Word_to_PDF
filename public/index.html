<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conversor Word ⇆ PDF</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Conversor de Documentos (Word ⇆ PDF)</h1>
      <p class="muted">Envie um arquivo Word (.docx) ou PDF e escolha o formato de saída.</p>

      <form id="convert-form">
        <div class="field">
          <label for="file">Documento:</label>
          <input id="file" name="file" type="file" accept=".pdf,.doc,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required />
        </div>

        <div class="field">
          <label for="target">Converter para:</label>
          <select id="target" name="target">
            <option value="pdf">PDF (.pdf)</option>
            <option value="docx">Word (.docx)</option>
          </select>
        </div>

        <button type="submit">Converter</button>
      </form>

      <div id="result" class="result hidden"></div>

      <div id="progress-wrap" class="progress-wrap hidden">
        <label id="progress-text" for="progress">Progresso: 0%</label>
        <progress id="progress" max="100" value="0"></progress>
      </div>

      <div id="download-wrap" class="hidden" style="margin-top: 12px;">
        <a id="download" class="button" href="#" download>Baixar arquivo convertido</a>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
  </html>
